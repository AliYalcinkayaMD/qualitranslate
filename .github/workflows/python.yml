name: Python package

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          # Python 3.9 is still the default python3 on many Macs (Xcode command line tools).
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Shared files are in sync
        run: python tools/sync_shared.py --check
      - name: Tests
        working-directory: python/tests
        env:
          PYTHONPATH: ../src
        run: python -m unittest discover -s . -v
      - name: Build and check the distribution
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
