name: Python package

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shared files are in sync
        run: python tools/sync_shared.py --check
      - name: Tests
        working-directory: python/tests
        env:
          PYTHONPATH: ../src
          # Runs the Copilot page-fixture tests in headless Chrome on Linux (skipped elsewhere).
          QT_TEST_CHROME: ${{ runner.os == 'Linux' && '/usr/bin/google-chrome' || '' }}
        run: python -m unittest discover -s . -v
      - name: Build and check the distribution
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
